spring.application.name=idv-doraclick
server.port=${PORT:8080}

# Local tools. Override with environment variables in production.
yt-dlp.path=${YTDLP_PATH:D:/instagram-downloader/tools/yt-dlp.exe}
yt-dlp.download-dir=${YTDLP_DOWNLOAD_DIR:D:/instagram-downloader/idv-doraclick/downloads}
yt-dlp.ffmpeg-path=${FFMPEG_PATH:D:/instagram-downloader/tools/ffmpeg.exe}

# Trusted browser origins (patterns, comma-separated). Browsers always send
# an Origin header on POST fetches, and Spring rejects unlisted origins with
# 403 "Invalid CORS request" — including same-host calls arriving through
# the Railway proxy. Keep localhost entries for dev, production hosts for live.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://downloadinstavideo.website,https://*.up.railway.app}

# Respect X-Forwarded-Proto/Host from the Railway proxy so the app sees the
# real public scheme/host when evaluating requests.
server.forward-headers-strategy=framework

# Contact form mail via Resend HTTPS API (port 443 — cloud hosts often
# block outbound SMTP ports, so SMTP is not usable from Railway).
# Get a free key at https://resend.com (100 emails/day free).
# The key sends to your own signup email without domain verification.
# Never commit the key; set it as an env var.
resend.api.key=${RESEND_API_KEY:}
app.contact.to=${CONTACT_TO:}
app.contact.from=${CONTACT_FROM:onboarding@resend.dev}

# Do not store database credentials in source code.
# The current downloader MVP does not require a database.

# Generated media cleanup. Files are deleted immediately after a successful/failed
# file response, with this scheduled job as a fallback for abandoned downloads.
yt-dlp.cleanup.max-age-minutes=${DOWNLOAD_CLEANUP_MAX_AGE_MINUTES:30}
yt-dlp.cleanup.interval-ms=${DOWNLOAD_CLEANUP_INTERVAL_MS:300000}
