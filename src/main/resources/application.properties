spring.application.name=idv-doraclick
server.port=${PORT:8080}

# Local tools. Override with environment variables in production.
yt-dlp.path=${YTDLP_PATH:D:/instagram-downloader/tools/yt-dlp.exe}
yt-dlp.download-dir=${YTDLP_DOWNLOAD_DIR:D:/instagram-downloader/idv-doraclick/downloads}
yt-dlp.ffmpeg-path=${FFMPEG_PATH:D:/instagram-downloader/tools/ffmpeg.exe}

# CORS origins for SEPARATE dev servers only (Vite :5173 -> Spring :8080).
# The merged build serves the UI and API from the same origin (:8080),
# so browsers make no cross-origin requests in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Do not store database credentials in source code.
# The current downloader MVP does not require a database.

# Generated media cleanup. Files are deleted immediately after a successful/failed
# file response, with this scheduled job as a fallback for abandoned downloads.
yt-dlp.cleanup.max-age-minutes=${DOWNLOAD_CLEANUP_MAX_AGE_MINUTES:30}
yt-dlp.cleanup.interval-ms=${DOWNLOAD_CLEANUP_INTERVAL_MS:300000}
